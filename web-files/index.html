  <template id="tpl-mattwebsite">
    <div class="cs-wrap">
      <div class="cs-section-1">
        <h1 class="cs-title">MATT Official Website Redesign</h1>
          <div class="cs-body-text">
            <p>Coming into the new academic year, our goal was to redesign the MATT team's official website to reflect the team's updated brand identity and improve user experience. The project team consisted of 3 members from the Branding and Design sub-team.</p>
            <p>The legacy website was functional, but it did not reflect the team's new brand identity — which was more playful and creative. It looked a bit generic, leaned on stock-style graphics, and had clunky, text-heavy menus and odd colour combinations that sometimes hindered readability. We conducted a competitive analysis, accessibility audit, and gathered input from internal stakeholders before translating our findings into low-fidelity wireframes and prototypes in Figma.</p>
            <p>The final website introduces a refreshed homepage, a more interactive projects experience, and clearer recruitment flows, all wrapped in a new visual style built around hand-drawn illustrations and an accessible colour palette. Visit the website <a href="http://www.monatt.org" target="_blank">here</a>.</p>
          </div>
          <div class="cs-tags">
            <span class="cs-tag-pill">Web Design</span>
            <span class="cs-tag-pill">Branding</span>
            <span class="cs-tag-pill">UX Research</span>
            <span class="cs-tag-pill">Squarespace</span>
            <span class="cs-tag-pill">Student Project</span>
            <span class="cs-tag-pill">Accessibility</span>
          </div>
          <div class="cs-imgs">
            <img src="images/matt-website-thumbnail.png" alt="MATT Official Website Redesign" />
          </div>
      </div>
      <div class="cs-bottom-bar">
        <button class="cs-close-pill" onclick="closeCase()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <template id="tpl-assistivefutures">
    <div class="cs-wrap">
      <div class="cs-section-1">
        <h1 class="cs-title">Designing an Interactive Card Game</h1>
        <div class="cs-body-text">
          <p>A collaboration between Monash Assistive Tech Team (MATT) and the Monash Faculty of IT, the Assistive Futures Workshop centres on an interactive card game that helps participants imagine and design future assistive technologies through playful, guided prompts. Designed for Year 10–12 students and above, it uses a flexible format that can easily adapt to older audiences as well.</p>
          <p>As the Lead Artist on this project, my role focused on creating a consistent visual identity for the card game, ensuring that all elements aligned with the workshop's accessible and inclusive theme. I worked on the individual card designs which included a diverse range of characters, approaching the overall art direction with a cartoon style to be approachable for younger audiences. The final deck of 17 cards took about 2–3 weeks to complete and print.</p>
          <p>Overall, majority of students rated the workshop highly, with an average engagement score of 4/5. The positive scores and "fun and engaging" feedback suggests the card designs and visual tone supported the inclusive, low-pressure experience we were aiming for.</p>
        </div>
        <div class="cs-tags">
          <span class="cs-tag-pill">Illustration</span>
          <span class="cs-tag-pill">Art Direction</span>
          <span class="cs-tag-pill">Card Design</span>
          <span class="cs-tag-pill">Character Design</span>
          <span class="cs-tag-pill">Student Project</span>
          <span class="cs-tag-pill">Workshop</span>
        </div>
        <div class="cs-hero-img" style="background:#487dc2;">
          <img src="images/digital-futures.png" alt="Card game" onerror="this.style.display='none'" />
        </div>
        <div class="cs-extra-imgs">

  <template id="tpl-capstoneproject">
    <div class="cs-wrap">
      <div class="cs-section-1">
        <h1 class="cs-title">Lord Quacksalot and the Soup of Doom</h1>
          <div class="cs-body-text">
            <p>A genre-bending, hybrid 2D/3D adventure game that blends exploration, puzzles, and chaos. Aimed at midcore players who love stylized visuals and humor, the game hops between levels styled after popular Hollywood movie tropes — ranging from a gritty Spaghetti Western to a ghostly Broadway theater.</p>
            <p>Working in a team of 5 students of various IT backgrounds, we needed to create a cohesive narrative and gameplay experience for a world-hopping game without feeling disjointed. As Lead Character Designer and Assistant Environmental Designer, I used Aseprite for pixel art character sprites and Adobe Substance Painter for environment textures — both tools I was learning for the first time. We anchored the narrative around Hollywood genres and show business, using competitor analysis and user personas to refine our direction.</p>
            <p>By the end of the year, we launched on Itch.io, delivering the most polished and stable build possible within our timeframe. The game's art was one of the highlights based on player feedback during the final playtest session — a deeply rewarding outcome that pushed me well outside my comfort zone.</p>
          </div>

  <script>
    const overlay = document.getElementById('case-overlay');
    const caseContent = document.getElementById('case-content');
 
    function openCase(id) {
      const tpl = document.getElementById('tpl-' + id);
      if (!tpl) return;
      caseContent.innerHTML = '';
      caseContent.appendChild(tpl.content.cloneNode(true));
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
    }
 
    function closeCase() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
 
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCase(); });
 
    // scroll-triggered blur scrim
    const blurScrim = document.getElementById('nav-blur-scrim');
    function updateScrim() {
      if (window.scrollY > 20) {
        blurScrim.classList.add('visible');
      } else {
        blurScrim.classList.remove('visible');
      }
    }
    window.addEventListener('scroll', updateScrim, { passive: true });
    updateScrim(); // run once on load

    // active nav on scroll
    const navLinks = document.querySelectorAll('.nav-link');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(a => a.classList.remove('active'));
          const active = document.querySelector(`.nav-link[data-section="${entry.target.id}"]`);
          if (active) active.classList.add('active');
        }
      });
    }, { threshold: 0.4 });
    ['home','projects','story','connect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
 
    function toggleMenu() {
      const menu = document.getElementById('nav-mobile-menu');
      const btn  = document.getElementById('nav-hamburger');
      const nav  = document.getElementById('main-nav');
      const opening = !menu.classList.contains('open');
      menu.classList.toggle('open', opening);
      btn.classList.toggle('open', opening);
      nav.classList.toggle('nav-hidden', opening);
    }
    function closeMenu() {
      document.getElementById('nav-mobile-menu').classList.remove('open');
      document.getElementById('nav-hamburger').classList.remove('open');
      document.getElementById('main-nav').classList.remove('nav-hidden');
    }
 
  </script>
