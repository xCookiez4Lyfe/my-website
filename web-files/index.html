  <template id="tpl-mattwebsite">
    <div class="cs-hero" style="background-image:url('images/matt-website-thumbnail.png'); background-color:#897cce;">
      <div class="cs-hero-text"><span>MATT Official <br> Website Redesign</span></div>
    </div>
    <div class="wrap">
      <div class="cs-header fade-in">
        <div class="cs-meta"><div class="cs-meta-item"><span class="cs-meta-label">STUDENT PROJECT</span></div></div>
        <h1>MATT Official Website Redesign</h1>
        <p class="subtitle">Coming into the new academic year, our goal was to redesign the team's official website to reflect MATT's updated brand identity and improve user experience. The project team consisted of 3 members from the Branding and Design sub-team.</p>
      </div>
      <div class="cs-body">
        <div class="cs-section fade-in">
          <p class="cs-section-label">01: Overview</p>
          <h2>The Problem</h2>
          <p>The legacy website was functional, but it did not reflect the team's new brand identity - which was more playful and creative. It looked a bit generic, leaned on stock-style graphics, and had clunky, text-heavy menus and odd colour combinations that sometimes hindered readability. Our redesign project was all about giving the website a fresh look, bringing in hand‑drawn assets, improving website navigation, fixing contrast issues, and making our projects and recruitment info feel more engaging in order to boost outreach and user engagement on the team's website.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add a screenshot or diagram here — e.g. before/after, user flow, or problem framing</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">02: Research & Process</p>
          <h2>The Approach</h2>
          <p>To guide the direction of our redesign project, we conducted a competitive analysis of other student team websites to understand what made them feel engaging, and professional at the same time. Additionally, we conducted an accessibility audit on the legacy site to identify issues such as dense dropdown menus, weak colour contrast, and a static projects section that did not invite exploration. We also gathered input from internal stakeholders by asking team members what they wanted to see on the site, with common requests including more interactivity and animated elements on the website.</p>
          <p>These findings were translated into low‑fidelity wireframes and prototypes in Figma, exploring alternative layouts, navigation patterns, and a refined colour palette. After 2–3 rounds of iteration and feedback from the team lead, the selected design direction was approved and then implemented on Squarespace by progressively replacing the legacy pages with the new components and visuals.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add wireframes, affinity maps, journey maps, or research notes here</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">03: Final Design</p>
          <h2>The Outcome</h2>
          <p>The final website introduces a refreshed homepage, a more interactive projects experience, and clearer recruitment flows, all wrapped in a new visual style built around hand-drawn illustrations and an accessible colour palette. Website navigation is simpler, the projects page now uses a carousel to encourage exploration, and a dedicated Recruitment page guides prospective members through the application process with clear calls to action and expectations. Together, these changes align the site with the team's new brand identity and provide better support for recruitment and outreach goals.</p>
          <p>Visit the website <a href="http://www.monatt.org">here</a></p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add your final high-fidelity screens or prototype here</span></div>

  <template id="tpl-assistivefutures">
    <div class="cs-hero" style="background-image:url('images/interactive-card-thumbnail.png'); background-color:#487dc2;">
      <div class="cs-hero-text"><span>Assistive Futures<br>Workshop (Card Game)</span></div>
    </div>
    <div class="wrap">
      <div class="cs-header fade-in">
        <div class="cs-meta"><div class="cs-meta-item"><span class="cs-meta-label">Student project</span></div></div>
        <h1>Designing an Interactive Card Game</h1>
        <p class="subtitle">A collaboration between Monash Assistive Tech Team (MATT) and the Monash Faculty of IT. The Assistive Futures Workshop centres on an interactive card game that helps participants imagine and design future assistive technologies through playful, guided prompts. Designed for Year 10-12 students and above, it uses a flexible format that can easily adapt to older audiences as well.</p>
      </div>
      <div class="cs-body">
        <div class="cs-section fade-in">
          <p class="cs-section-label">01: Overview</p>
          <h2>The Goal</h2>
          <p>The card game was designed to provide facilitators with everything they need to run a smooth, engaging workshop where participants work in teams to tackle real-world accessibility challenges and design imaginative future technologies. With playful visuals and collaborative team play, it aims to inspire creativity and design thinking, helping participants learn, experiment, and pitch ideas without feeling like they are being tested.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add a screenshot of the original interface or a problem framing diagram</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">02: Research & Process</p>
          <h2>The Approach</h2>
          <p>As the Lead Artist on this project, my role focused on creating a consistent visual identity for the card game, ensuring that all elements aligned with the workshop's accessible and inclusive theme. I worked on the individual card designs which included a diverse range of characters, and approached the overall art direction with a cartoon style because I wanted it to be approachable for younger audiences.</p>
          <p>The final deck consisting of 17 game cards (7 Scenario Cards and 10 Future Tech Cards) took about 2-3 weeks to be completed and printed out. Before the final implementation, we conducted a playtest session to ensure the designs were ready for the Assistive Futures Workshop on the 21st of September 2025.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add your heuristic analysis findings, user journey map, or test notes</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">03: Final Design</p>
          <h2>The Outcome</h2>
          <p>Overall, majority of students rated the workshop highly, with an average engagement score of 4/5. Based on their feedback, it helped them think deeply about accessibility and the kinds of assistive technologies people might need in real life.</p>
          <p>From a personal perspective, the most satisfying moment being the Lead Artist was seeing the visual style of the game appeal to the target audience. The positive engagement scores and "fun and engaging" feedback suggests that the card designs and overall visual tone supported the inclusive, low-pressure experience we were aiming for.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add before/after screens or your redesigned checkout flow here</span></div>

  <template id="tpl-capstoneproject">
    <div class="cs-hero" style="background-image:url('images/interactive-card-thumbnail.png'); background-color:#487dc2;">
      <div class="cs-hero-text"><span>Monash University<br>Capstone Project</span></div>
    </div>
    <div class="wrap">
      <div class="cs-header fade-in">
        <div class="cs-meta"><div class="cs-meta-item"><span class="cs-meta-label">Capstone Project</span></div></div>
        <h1>Lord Quacksalot and the Soup of Doom</h1>
        <p class="subtitle">A genre-bending, hybrid 2D/3D adventure game that blends exploration, puzzles, and chaos. Aimed at midcore players who love stylized visuals and humor, the game hops between levels styled after popular Hollywood movie tropes ranging from a gritty Spaghetti Western to a ghostly Broadway theater.</p>
      </div>
      <div class="cs-body">
        <div class="cs-section fade-in">
          <p class="cs-section-label">01: Overview</p>
          <h2>The Challenge</h2>
          <p>Working together in a team of 5 students of various IT backgrounds, we needed to create a cohesive narrative and gameplay experience for a world-hopping game that consisted of different genres and mechanics without feeling disjointed. Additionally, the game required a structured way to teach players unique mechanics in each level while preparing them for a spike in difficulty later on. To achieve this, we had to ensure that the different themes felt connected and that the learning curve naturally built towards an end goal.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add a brief or problem framing visual here</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">02: Research & Process</p>
          <h2>The Approach</h2>
          <p>As the Lead Character Designer and Assistant Environmental Designer, I used Aseprite as my primary tool for creating character sprites and Adobe Substance Painter for texturing environments. A lot of self learning was involved from my end especially in understanding the Aseprite software and character design workflow since it was my first time working with pixel art.</p>
          <p>We tied together the game's narrative by anchoring it to a core theme of Hollywood genres and show business, using targeted competitor analysis and user personas to refine our direction. Furthermore, regular in-class playtesting sessions provided critical feedback, allowing us to iteratively polish the character art, environment textures, audio, and gameplay mechanics.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add early sketches, wireframes, or information architecture here</span></div>
        </div>
        <div class="cs-section fade-in">
          <p class="cs-section-label">03: Final Designs</p>
          <h2>The Outcome</h2>
          <p>By the end of the year, we launched our game on Itch.io, delivering the most polished and stable build possible within our timeframe. The final product successfully achieves a playful, humorous tone with distinct visual styles that offer a uniquely engaging indie experience.</p>
          <p>On a personal note, working on the game art was such a rewarding experience because it was one of the highlights of the game based on feedback from players during the final playtest session. This project definitely pushed me out of my comfort zone to take on a new role and helped me to grow as a designer, and I'm really proud of the entire team for the work that they put into this project.</p>
          <div class="cs-image-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add your final dashboard UI screens here</span></div>
        </div>

  <script>
    // ── CASE STUDY OVERLAY ──────────────────────────────────────
    const overlay = document.getElementById('case-overlay');
    const caseContent = document.getElementById('case-content');

    function openCase(id) {
      const tpl = document.getElementById('tpl-' + id);
      if (!tpl) return;
      caseContent.innerHTML = '';
      caseContent.appendChild(tpl.content.cloneNode(true));
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
    }

    function closeCase() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCase();
    });

    // ── ACTIVE NAV LINK ON SCROLL ───────────────────────────────
    const sections = ['home', 'projects', 'story', 'connect'];
    const navLinks = document.querySelectorAll('.nav-link');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(a => a.classList.remove('active'));
          const active = document.querySelector(`.nav-link[data-section="${entry.target.id}"]`);
          if (active) active.classList.add('active');
        }
      });
    }, { threshold: 0.4 });

    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });

    // ── TYPEWRITER (fires when #story scrolls into view) ────────
    const twSegments = [
      { text: 'Currently learning: ', italic: false },
      { text: 'Advanced Figma Prototyping', italic: true }
    ];
    let twFired = false;

    const storyObs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && !twFired) {
        twFired = true;
        runTypewriter();
      }
    }, { threshold: 0.3 });
    const storyEl = document.getElementById('story');
    if (storyEl) storyObs.observe(storyEl);

    function runTypewriter() {
      const el = document.getElementById('typewriter-heading');
      if (!el) return;
      el.innerHTML = '';
      let segIndex = 0, charIndex = 0, currentSpan = null;
      function type() {
        if (segIndex >= twSegments.length) { el.classList.remove('typing'); return; }
        const seg = twSegments[segIndex];
        if (charIndex === 0) {
          if (seg.text.startsWith('\n')) {
            el.appendChild(document.createElement('br'));
            twSegments[segIndex] = { ...seg, text: seg.text.slice(1) };
          }
          currentSpan = document.createElement(seg.italic ? 'em' : 'span');
          el.appendChild(currentSpan);
        }
        currentSpan.textContent += seg.text[charIndex];
        charIndex++;
        if (charIndex >= seg.text.length) { segIndex++; charIndex = 0; }
        setTimeout(type, segIndex === twSegments.length ? 60 : 45);
      }
      el.classList.add('typing');
      setTimeout(type, 300);
    }
  </script>
